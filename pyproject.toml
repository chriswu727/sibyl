[project]
name = "sibyl-research"
dynamic = ["version"]
description = "A research MCP for AI agents: persistent evidence, counterevidence and gap tracking, with optional host-authored reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yichen Wu", email = "yichenwujob@gmail.com"}]
urls = {Homepage = "https://yichenwu.dev/projects/sibyl", Documentation = "https://github.com/chriswu727/sibyl#readme", Repository = "https://github.com/chriswu727/sibyl", Issues = "https://github.com/chriswu727/sibyl/issues"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["research", "evidence", "retrieval", "mcp", "citations", "agents"]
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "pydantic>=2.11,<3",
    "httpx>=0.27.0",
    "httpcore>=1.0.9,<2.0.0",
    "certifi>=2024.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.1",
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
report = [
    "fpdf2>=2.7.0",
    "pillow>=13.0.0",
]
extract = ["trafilatura>=2.0,<3.0"]
pdf = ["pypdf>=6.21.2,<7"]
monitor = ["uvicorn>=0.54.0,<1"]
rerank = ["flashrank>=0.2.10,<0.3"]
all = [
    "pypdf>=6.21.2,<7",
    "uvicorn>=0.54.0,<1",
    "pillow>=13.0.0",
    "fpdf2>=2.7.0",
    "trafilatura>=2.0,<3.0",
    "flashrank>=0.2.10,<0.3",
]

[project.scripts]
sibyl = "sibyl.cli:main"
sibyl-mcp = "sibyl.mcp_server:main"
sibyl-research = "sibyl.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["sibyl"]

[tool.hatch.version]
path = "sibyl/__init__.py"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["sibyl/job_models.py", "sibyl/job_store.py", "sibyl/research_state.py", "sibyl/research_review.py", "sibyl/research_jobs.py", "sibyl/research_views.py", "sibyl/research_claims.py", "sibyl/mcp_errors.py", "sibyl/report_exports.py"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
