[project]
name = "sibyl-research"
version = "0.2.2"
description = "AI-powered deep research agent — market analysis, trend prediction, topic research with multi-LLM support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yichen Wu", email = "yichenwujob@gmail.com"}]
urls = {Homepage = "https://github.com/chriswu727/sibyl", Repository = "https://github.com/chriswu727/sibyl"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["research", "ai", "deep-research", "mcp", "llm", "analysis", "prediction"]
dependencies = [
    # Floor tested to pass response_format json_object through to deepseek/ and
    # register v4-flash; ceiling pinned so a future release can't silently break
    # the extra_body={"thinking":...} contract the whole pipeline relies on.
    "litellm>=1.83.0,<2.0.0",
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.1",
    "trafilatura>=2.0,<3.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "fpdf2>=2.7.0",
    "yfinance>=0.2.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "pytrends>=4.9.0",
]

[project.optional-dependencies]
rerank = ["flashrank>=0.2.10,<0.3"]

[project.scripts]
sibyl = "sibyl.cli:main"
sibyl-mcp = "sibyl.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["sibyl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
