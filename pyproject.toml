[project]
name = "sibyl-research"
dynamic = ["version"]
description = "Deep-research MCP with persistent investigations, traceable evidence, and cited reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yichen Wu", email = "yichenwujob@gmail.com"}]
urls = {Homepage = "https://github.com/chriswu727/sibyl", Repository = "https://github.com/chriswu727/sibyl"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["research", "evidence", "retrieval", "mcp", "citations", "agents"]
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.0,<2.0.0",
    "certifi>=2024.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.1",
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
report = [
    # Floor tested to pass response_format json_object through to deepseek/ and
    # register v4-flash; ceiling protects the provider-specific thinking contract.
    "litellm>=1.96.2,<2.0.0",
    "fpdf2>=2.7.0",
    "pillow>=13.0.0",
]
finance = [
    "pillow>=13.0.0",
    "yfinance>=0.2.0",
    "matplotlib>=3.8.0",
    "pandas>=3.0.6",
    "pytrends>=4.9.0",
]
extract = ["trafilatura>=2.0,<3.0"]
rerank = ["flashrank>=0.2.10,<0.3"]
all = [
    "pillow>=13.0.0",
    "litellm>=1.96.2,<2.0.0",
    "fpdf2>=2.7.0",
    "yfinance>=0.2.0",
    "matplotlib>=3.8.0",
    "pandas>=3.0.6",
    "pytrends>=4.9.0",
    "trafilatura>=2.0,<3.0",
    "flashrank>=0.2.10,<0.3",
]

[project.scripts]
sibyl = "sibyl.cli:main"
sibyl-mcp = "sibyl.mcp_server:main"
sibyl-research = "sibyl.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["sibyl"]

[tool.hatch.version]
path = "sibyl/__init__.py"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
