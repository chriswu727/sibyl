name: Bug report
description: Report a reproducible Sibyl problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Sibyl version and source commit
      placeholder: "0.4.0 development, commit from git rev-parse --short HEAD; or PyPI 0.3.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, MCP host, profile, installed extras"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command or MCP call, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant SourceBundle/research-job status, extraction warnings, or sanitized monitoring outcomes. Remove tokens, provider keys, private queries, and evidence text before sharing.
