name: Bug report
description: Report a reproducible Sibyl problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Sibyl version and source commit
      placeholder: "sibyl --version and git rev-parse --short HEAD (published 0.4.0b1/0.3.0 are the retired MCP server)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, agent host, installed extras"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, a minimal ledger, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include the relevant part of the .check.json result (source errors, extraction warnings, issues). Remove private URLs and content before sharing.
