name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover tests -v
      - name: Check lexical retrieval regression floor
        run: python scripts/eval_retrieval.py --ranker lexical
      - name: Check end-to-end retrieval pipeline regression floor
        run: python scripts/eval_retrieval_pipeline.py --ranker lexical
      - name: Check source-quality evaluation baseline
        run: python scripts/eval_source_quality.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
