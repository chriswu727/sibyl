name: live retrieval gate

# Model-free 66-case gates with frozen thresholds, run on a GitHub-hosted runner
# so results do not depend on a developer machine's network. "keyless" measures
# Sibyl's own discovery through public search providers; "host_sources" reads
# each case's frozen host-supplied URLs (the release gate). Neither uses a
# model. Results are uploaded as an artifact; a failed gate still uploads them.
on:
  workflow_dispatch:
    inputs:
      gate:
        description: Which gate to run
        type: choice
        options:
          - host_sources
          - keyless
        default: host_sources
      repeats:
        description: Repeats per case
        default: "3"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        env:
          GATE: ${{ inputs.gate }}
        run: |
          python -m pip install --upgrade "pip>=26.2.1" "setuptools>=83.0.0"
          # Host-supplied sources may be PDFs; keyless runs keep their old install.
          if [ "$GATE" = "host_sources" ]; then
            python -m pip install -e ".[pdf]"
          else
            python -m pip install -e .
          fi
      - name: Run the frozen live retrieval gate
        env:
          GATE: ${{ inputs.gate }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          if [ "$GATE" = "host_sources" ]; then
            SOURCES="--host-sources evals/host_source_cases.jsonl"
          fi
          python scripts/eval_live_retrieval.py --repeats "$REPEATS" $SOURCES \
            --output live-retrieval.json
      - name: Upload raw metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-retrieval-${{ inputs.gate }}-${{ github.sha }}
          path: live-retrieval.json
          if-no-files-found: warn
